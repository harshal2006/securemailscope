# Port -> protocol/mode/role mapping used to interpret captured sessions.
#
# "starttls_ports" carry plaintext first, then may upgrade via STARTTLS/STLS.
# "implicit_ports" are TLS from the first byte of the session.
#
# "role" distinguishes server-to-server (mx) traffic, where opportunistic
# TLS on port 25 is normal internet behavior, from client-facing
# (submission) traffic on 587/465/143/993/110/995, where a client failing
# to use available TLS is a real posture problem. See rules T-02/T-03.
#
# Includes both IANA-standard ports and the SecureMailScope lab's
# host-published ports (see lab/docker/docker-compose.yml), since Docker
# remaps privileged ports to avoid needing root.

smtp:
  starttls_ports:
    mx: [25, 2525]
    submission: [587, 2587, 2588]  # 2588: lab's STARTTLS-disabled variant, see lab/docker
  implicit_ports:
    # 8587: legacy-cipher/TLS-version test endpoint (raw `openssl
    # s_server`, implicit TLS from byte one, no STARTTLS) - see
    # lab/legacy-tls/ and data/pcaps/CAPTURES.md.
    submission: [465, 4465, 8587]

imap:
  starttls_ports:
    submission: [143, 2143]
  implicit_ports:
    submission: [993, 2993]

pop3:
  starttls_ports:
    submission: [110, 2110]
  implicit_ports:
    submission: [995, 2995]
