# Severity/scoring metadata for certificate findings. Matching conditions
# (e.g. what counts as a "weak" key size) live in core/rules_engine.py;
# this file only holds the human-facing message and score impact.
#
# `id` is the plan's rule numbering (X-01 expired, X-03 self-signed,
# X-05 hostname/SAN mismatch, X-06 weak key, X-07 weak signature hash).
# CERT_NOT_OBSERVABLE and CERT_HOSTNAME_NOT_EVALUABLE have no id - they
# are informational states, not findings on the plan's checklist.

CERT_EXPIRED:
  id: X-01
  severity: HIGH
  score_impact: 30
  message: "Certificate is expired (or not yet valid)."

CERT_SELF_SIGNED:
  id: X-03
  severity: MEDIUM
  score_impact: 15
  message: "Certificate is self-signed; not verifiable via a trusted CA chain."

CERT_WEAK_KEY:
  id: X-06
  severity: HIGH
  score_impact: 25
  message: "Certificate public key is below the minimum safe size (RSA/DSA < 2048 bits)."

CERT_WEAK_SIGNATURE_HASH:
  id: X-07
  severity: HIGH
  score_impact: 25
  message: "Certificate is signed using a weak hash algorithm (MD5 or SHA-1)."

CERT_HOSTNAME_MISMATCH:
  id: X-05
  severity: HIGH
  score_impact: 25
  message: "Certificate does not cover the hostname the client requested (SNI vs. SAN mismatch)."

CERT_HOSTNAME_NOT_EVALUABLE:
  severity: INFO
  score_impact: 0
  message: "No SNI observed in the ClientHello; hostname/SAN match cannot be evaluated (not guessed)."

CERT_NOT_OBSERVABLE:
  severity: INFO
  score_impact: 0
  message: "Certificate not observable from this capture; see reason for detail."
