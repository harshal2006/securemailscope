# Lab-only Dovecot config. Not for production use.

protocols = imap pop3
listen = *

mail_location = maildir:~/Maildir

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/lab-users.txt
}
userdb {
  driver = static
  args = uid=labuser gid=labuser home=/home/labuser
}

!include conf.d/10-auth.conf
!include conf.d/10-master.conf
!include conf.d/10-ssl.conf
