[project]
name = "securemailscope"
version = "0.1.0"
description = "Passive, offline PCAP analyzer for SMTP/IMAP/POP3 cryptographic security posture"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "jsonschema>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
dashboard = [
    "streamlit>=1.30",
    "plotly>=5.20",
    "requests>=2.31",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
