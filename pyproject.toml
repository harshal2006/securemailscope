[project]
name = "securemailscope"
version = "0.1.0"
description = "Passive, offline PCAP analyzer for SMTP/IMAP/POP3 cryptographic security posture"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
